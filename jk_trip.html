<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JK Trip Logger</title>
<style>
:root{--bg:#e9eef2;--card:#fff;--ink:#102a3a;--mute:#5d7384;--acc:#0b7a75;--warn:#b3261e;--line:#cfd9e0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a22;--card:#17262f;--ink:#e8f1f5;--mute:#8fa5b3;--acc:#3dc9c0;--warn:#ff8a80;--line:#2b3f4b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:12px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{flex:1;min-height:48px;border:0;border-radius:8px;font:600 16px system-ui;background:var(--acc);color:#fff}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.4}
button:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.big b{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.big span,.small{color:var(--mute);font-size:13px}
.live{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.live b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
#status{font-size:14px;color:var(--mute);margin:8px 0 0}
#status.err{color:var(--warn)}
select{width:100%;min-height:44px;margin-top:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 8px}
.trip{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.trip:first-child{border-top:0}
</style>
</head>
<body>
<h1>JK Trip Logger</h1>

<div class="card">
  <div class="row">
    <button id="btnConn">Sambung ke BMS</button>
    <button id="btnStart" disabled>Mulai perjalanan</button>
    <button id="btnStop" class="alt" disabled>Selesai</button>
  </div>
  <p id="status">Belum tersambung. Gunakan Chrome di Android dan nyalakan Bluetooth + GPS.</p>
</div>

<div class="card">
  <div class="big">
    <div><b id="dist">0.00</b><span>km</span></div>
    <div><b id="ah">0.00</b><span>Ah terpakai (hitung arus)</span></div>
    <div><b id="ahkm">–</b><span>Ah/km</span></div>
    <div><b id="whkm">–</b><span>Wh/km</span></div>
  </div>
  <p class="small" id="ahBms">Ah terpakai menurut kapasitas BMS: –</p>
</div>

<div class="card">
  <div class="live">
    <div><b id="v">–</b><span>Volt</span></div>
    <div><b id="a">–</b><span>Amp</span></div>
    <div><b id="soc">–</b><span>SOC %</span></div>
    <div><b id="spd">–</b><span>km/j</span></div>
  </div>
</div>

<div class="card">
  <label class="small" for="layout">Format frame BMS</label>
  <select id="layout">
    <option value="auto">Otomatis</option>
    <option value="0">JK02 24S (offset 0)</option>
    <option value="32">JK02 32S (offset 32)</option>
  </select>
</div>

<div class="card">
  <div class="row"><button id="btnCsv" class="alt" disabled>Unduh CSV perjalanan ini</button>
  <button id="btnClear" class="alt">Hapus riwayat</button></div>
  <div id="history" style="margin-top:8px"></div>
</div>

<script>
const SVC = '0000ffe0-0000-1000-8000-00805f9b34fb';
const CHR = '0000ffe1-0000-1000-8000-00805f9b34fb';
const $ = id => document.getElementById(id);

let chr = null, buf = [], lastFrame = 0, poll = null, wake = null;
let gpsId = null, gps = { lat: null, lon: null, spd: 0 }, lastPos = null;
let trip = null, last = null, rows = [];

function setStatus(t, err) { $('status').textContent = t; $('status').className = err ? 'err' : ''; }

/* ---------- BMS ---------- */
function cmd(code) {
  const f = new Uint8Array(20);
  f.set([0xAA, 0x55, 0x90, 0xEB, code]);
  f[19] = f.slice(0, 19).reduce((s, b) => (s + b) & 255, 0);
  return chr.writeValueWithoutResponse(f);
}

async function connect() {
  try {
    const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [SVC] });
    dev.addEventListener('gattserverdisconnected', () => {
      clearInterval(poll); chr = null;
      setStatus('Sambungan BMS terputus. Tekan "Sambung ke BMS" lagi.', true);
      $('btnConn').disabled = false;
    });
    setStatus('Menyambung ke ' + (dev.name || 'perangkat') + '…');
    const srv = await dev.gatt.connect();
    chr = await (await srv.getPrimaryService(SVC)).getCharacteristic(CHR);
    await chr.startNotifications();
    chr.addEventListener('characteristicvaluechanged', e => onChunk(new Uint8Array(e.target.value.buffer)));
    await cmd(0x97);
    await cmd(0x96);
    poll = setInterval(() => { if (chr && Date.now() - lastFrame > 3000) cmd(0x96).catch(() => {}); }, 2000);
    $('btnConn').disabled = true; $('btnStart').disabled = false;
    setStatus('Tersambung. Menunggu data BMS…');
  } catch (e) { setStatus('Gagal menyambung: ' + e.message, true); }
}

function onChunk(c) {
  if (c.length >= 4 && c[0] === 0x55 && c[1] === 0xAA && c[2] === 0xEB && c[3] === 0x90) buf = [];
  buf.push(...c);
  if (buf.length >= 300) {
    const f = new Uint8Array(buf.slice(0, 300)); buf = [];
    if (f[4] === 0x02) onCellFrame(f);
  }
}

function fields(f, off) {
  const d = new DataView(f.buffer);
  return {
    v: d.getUint32(118 + off, true) / 1000,
    i: d.getInt32(126 + off, true) / 1000,       // + = mengisi, − = memakai
    soc: f[139 + off],
    remain: d.getUint32(140 + off, true) / 1000,
    t: d.getInt16(130 + off, true) / 10
  };
}

function detectOffset(f) {
  const sel = $('layout').value;
  if (sel !== 'auto') return +sel;
  const d = new DataView(f.buffer);
  const score = off => {
    const x = fields(f, off), n = off ? 32 : 24; let sum = 0, cnt = 0;
    for (let k = 0; k < n; k++) { const c = d.getUint16(6 + 2 * k, true); if (c > 2000 && c < 4500) { sum += c; cnt++; } }
    if (x.soc > 100 || x.v < 5 || x.v > 200 || cnt < 3) return 9;
    return Math.abs(x.v - sum / 1000) / x.v;
  };
  return score(0) <= score(32) ? 0 : 32;
}

function onCellFrame(f) {
  const x = fields(f, detectOffset(f)), now = Date.now();
  lastFrame = now;
  $('v').textContent = x.v.toFixed(1);
  $('a').textContent = x.i.toFixed(1);
  $('soc').textContent = x.soc;
  if (trip) {
    const dt = last ? Math.min((now - last) / 1000, 5) : 0;
    trip.ah += -x.i * dt / 3600;
    trip.wh += -x.i * x.v * dt / 3600;
    trip.remainNow = x.remain;
    if (trip.remain0 === null) trip.remain0 = x.remain;
    rows.push([new Date(now).toISOString(), gps.lat, gps.lon, gps.spd.toFixed(1), trip.dist.toFixed(3),
      x.v.toFixed(2), x.i.toFixed(2), x.soc, x.remain.toFixed(2), x.t.toFixed(1)].join(','));
    render();
  }
  last = now;
  setStatus(trip ? 'Merekam perjalanan…' : 'Tersambung. Siap mulai.');
}

/* ---------- GPS ---------- */
function haversine(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function startGps() {
  gpsId = navigator.geolocation.watchPosition(p => {
    const c = p.coords;
    gps = { lat: c.latitude.toFixed(6), lon: c.longitude.toFixed(6), spd: (c.speed || 0) * 3.6 };
    $('spd').textContent = gps.spd.toFixed(0);
    if (c.accuracy > 30) return;                      // abaikan sinyal buruk
    const pos = { lat: c.latitude, lon: c.longitude };
    if (trip && lastPos) {
      const d = haversine(lastPos, pos);
      if (d > 0.003 || gps.spd > 3) trip.dist += d;   // saring goyangan GPS saat diam
    }
    lastPos = pos;
    if (trip) render();
  }, e => setStatus('GPS error: ' + e.message, true), { enableHighAccuracy: true, maximumAge: 0 });
}

/* ---------- Perjalanan ---------- */
function render() {
  $('dist').textContent = trip.dist.toFixed(2);
  $('ah').textContent = trip.ah.toFixed(2);
  $('ahkm').textContent = trip.dist > 0.2 ? (trip.ah / trip.dist).toFixed(2) : '–';
  $('whkm').textContent = trip.dist > 0.2 ? (trip.wh / trip.dist).toFixed(1) : '–';
  const used = trip.remain0 !== null ? (trip.remain0 - trip.remainNow) : 0;
  $('ahBms').textContent = 'Ah terpakai menurut kapasitas BMS: ' + used.toFixed(2);
}

async function start() {
  trip = { t0: Date.now(), dist: 0, ah: 0, wh: 0, remain0: null, remainNow: 0 };
  rows = []; last = null; lastPos = null;
  if (gpsId === null) startGps();
  try { wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  $('btnStart').disabled = true; $('btnStop').disabled = false; $('btnCsv').disabled = true;
  setStatus('Merekam perjalanan… biarkan layar tetap menyala.');
}

function stop() {
  const used = trip.remain0 !== null ? trip.remain0 - trip.remainNow : null;
  const h = JSON.parse(localStorage.getItem('jkTrips') || '[]');
  h.unshift({ t: trip.t0, dist: trip.dist, ah: trip.ah, wh: trip.wh, ahBms: used });
  localStorage.setItem('jkTrips', JSON.stringify(h.slice(0, 100)));
  trip = null; if (wake) wake.release().catch(() => {});
  $('btnStart').disabled = false; $('btnStop').disabled = true; $('btnCsv').disabled = rows.length === 0;
  setStatus('Perjalanan disimpan.'); showHistory();
}

function showHistory() {
  const h = JSON.parse(localStorage.getItem('jkTrips') || '[]');
  $('history').innerHTML = h.length ? h.map(t => `<div class="trip"><b>${new Date(t.t).toLocaleString('id-ID')}</b><br>
    ${t.dist.toFixed(2)} km · ${t.ah.toFixed(2)} Ah · ${t.dist > 0.2 ? (t.ah / t.dist).toFixed(2) : '–'} Ah/km ·
    ${t.dist > 0.2 ? (t.wh / t.dist).toFixed(1) : '–'} Wh/km</div>`).join('')
    : '<p class="small">Belum ada perjalanan tersimpan.</p>';
}

function csv() {
  const head = 'waktu,lat,lon,kecepatan_kmj,jarak_km,volt,amp,soc,sisa_ah,suhu\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([head + rows.join('\n')], { type: 'text/csv' }));
  a.download = 'perjalanan-' + new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-') + '.csv';
  a.click();
}

$('btnConn').onclick = connect;
$('btnStart').onclick = start;
$('btnStop').onclick = stop;
$('btnCsv').onclick = csv;
$('btnClear').onclick = () => { localStorage.removeItem('jkTrips'); showHistory(); };
if (!navigator.bluetooth) setStatus('Browser ini tidak mendukung Web Bluetooth. Pakai Chrome di Android.', true);
showHistory();
</script>
</body>
</html>
